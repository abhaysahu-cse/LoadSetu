version: "3.9"

# ============================================================================
# VahanSync Core Engine — Local Development Stack
#
# Mirrors production stack (Neon → local PG, Upstash → local Redis,
# MSK → local Kafka).
#
# Usage:
#   docker compose up -d          (start all services)
#   docker compose down -v        (stop and remove volumes)
#   docker compose logs -f kafka  (tail Kafka logs)
# ============================================================================

services:

  # ── PostgreSQL + PostGIS ────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: vahansync_postgres
    environment:
      POSTGRES_DB:       vahansync_db
      POSTGRES_USER:     vahansync
      POSTGRES_PASSWORD: vahansync_secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vahansync -d vahansync_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Upstash equivalent locally, no TLS) ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vahansync-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Zookeeper (required for single-node Kafka) ───────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: vahansync-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Apache Kafka ────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: vahansync-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID:                          1
      KAFKA_ZOOKEEPER_CONNECT:                  zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS:               PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:   1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:      1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:          "false"   # Matches spring.kafka.admin.auto-create=false
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Topic Initializer (one-shot container) ───────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: vahansync-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Creating Kafka topics...'
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 6  --replication-factor 1 --topic booking-events
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 12 --replication-factor 1 --topic truck-telemetry-events
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 6  --replication-factor 1 --topic load-status-events
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3  --replication-factor 1 --topic booking-events-dlq
      echo 'Topics created successfully.'
      kafka-topics --list --bootstrap-server kafka:9092
      "
    restart: "no"

  # ── Kafka UI (optional — browse topics and messages in browser) ──────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: vahansync-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME:            local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

volumes:
  postgres_data:
