version: "3.9"

# ============================================================================
# LoadSetu / VahanSync — Production Docker Compose
# 
# This orchestrates the complete production stack:
# - PostgreSQL + PostGIS (database)
# - Redis (cache)
# - Zookeeper + Kafka (event streaming)
# - Spring Boot Backend (core API)
# - FastAPI ML Engine (AI/matching)
# - Next.js Web App (frontend)
# - Nginx (reverse proxy)
#
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d
#   docker-compose -f docker-compose.prod.yml down
#   docker-compose -f docker-compose.prod.yml logs -f
# ============================================================================

networks:
  loadsetu-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local
  zookeeper_data:
    driver: local

services:

  # ── PostgreSQL + PostGIS ──────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: loadsetu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-vahansync_db}
      POSTGRES_USER: ${DB_USER:-vahansync}
      POSTGRES_PASSWORD: ${DB_PASS:-vahansync_secret}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - loadsetu-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vahansync} -d ${DB_NAME:-vahansync_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=2621kB
      -c min_wal_size=1GB
      -c max_wal_size=4GB

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: loadsetu-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - loadsetu-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000

  # ── Zookeeper ─────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: loadsetu-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_INIT_LIMIT: 10
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - loadsetu-network
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Apache Kafka ──────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: loadsetu-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - loadsetu-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ── Kafka Topic Initializer ───────────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: loadsetu-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - loadsetu-network
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo '⏳ Waiting for Kafka to be ready...'
      sleep 10
      echo '📝 Creating Kafka topics...'
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 6  --replication-factor 1 --topic booking-events
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 12 --replication-factor 1 --topic truck-telemetry-events
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 6  --replication-factor 1 --topic load-status-events
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3  --replication-factor 1 --topic whatsapp-inbound-events
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3  --replication-factor 1 --topic booking-events-dlq
      echo '✅ Topics created successfully.'
      kafka-topics --list --bootstrap-server kafka:29092
      "

  # ── Spring Boot Backend ───────────────────────────────────────────────────
  backend:
    build:
      context: ./vahansync-core-backend/vahansync
      dockerfile: Dockerfile
    container_name: loadsetu-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-vahansync_db}
      DB_USER: ${DB_USER:-vahansync}
      DB_PASS: ${DB_PASS:-vahansync_secret}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_SSL: "false"
      
      # Kafka
      KAFKA_BOOTSTRAP: kafka:29092
      
      # Security
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      
      # ULIP Integration
      ULIP_BASE_URL: ${ULIP_BASE_URL:-https://ulip.dpiit.gov.in/ulip}
      ULIP_API_KEY: ${ULIP_API_KEY}
      ULIP_MOCK: ${ULIP_MOCK:-true}
      
      # Payment Gateway
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      PAYMENT_MOCK: ${PAYMENT_MOCK:-true}
      
      # JVM Options
      JAVA_OPTS: "-Xms512m -Xmx2g -XX:+UseG1GC"
    networks:
      - loadsetu-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── FastAPI ML Engine ─────────────────────────────────────────────────────
  ml-engine:
    build:
      context: ./ml-engine/vahansync-ml
      dockerfile: Dockerfile
    container_name: loadsetu-ml-engine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # Service
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_LEVEL: INFO
      HOST: 0.0.0.0
      PORT: 8000
      WORKERS: 4
      RELOAD: "false"
      
      # Gemini AI
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash-exp}
      GEMINI_TEMPERATURE: ${GEMINI_TEMPERATURE:-0.1}
      
      # Database
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-vahansync}:${DB_PASS:-vahansync_secret}@postgres:5432/${DB_NAME:-vahansync_db}
      
      # Redis
      REDIS_URL: redis://redis:6379
      
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      
      # Spring Boot Integration
      SPRING_BOOT_BASE_URL: http://backend:8080
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      
      # WhatsApp / Twilio
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER}
      
      # Meta WhatsApp
      META_WHATSAPP_TOKEN: ${META_WHATSAPP_TOKEN}
      META_WHATSAPP_PHONE_NUMBER_ID: ${META_WHATSAPP_PHONE_NUMBER_ID}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
      
      # Payment
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
    networks:
      - loadsetu-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Next.js Web App ───────────────────────────────────────────────────────
  web:
    build:
      context: ./loadsetu-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SPRING_URL: ${NEXT_PUBLIC_SPRING_URL:-http://localhost/api/spring}
        NEXT_PUBLIC_FASTAPI_URL: ${NEXT_PUBLIC_FASTAPI_URL:-http://localhost/api/ai}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost/ws/notifications}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
        NEXT_PUBLIC_H3_HEATMAP_DEFAULT: ${NEXT_PUBLIC_H3_HEATMAP_DEFAULT:-true}
    container_name: loadsetu-web
    environment:
        NEXT_PUBLIC_SPRING_URL: http://backend:8080
        NEXT_PUBLIC_FASTAPI_URL: http://ml-engine:8000
        NEXT_PUBLIC_WS_URL: ws://localhost/ws/notifications
        NEXT_PUBLIC_APP_URL: http://100.26.141.203

    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      ml-engine:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - loadsetu-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s



  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: loadsetu-nginx
    restart: unless-stopped
    depends_on:
      - web
      - backend
      - ml-engine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - loadsetu-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
